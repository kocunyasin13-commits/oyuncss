<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Galaktik Savaşçı - Mağaza Oyunu</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050510;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        h1 {
            margin: 5px 0;
            letter-spacing: 3px;
            text-shadow: 0 0 15px #00d2ff;
        }

        #ust-panel {
            display: flex;
            gap: 20px;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        #oyunKapsayici {
            position: relative;
        }

        #oyunAlani {
            border: 3px solid #00d2ff;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.5);
            border-radius: 10px;
            background: linear-gradient(to bottom, #020208, #0b0b26);
            display: block;
        }

        #magazaEkrani {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 16, 0.9);
            backdrop-filter: blur(5px);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            z-index: 10;
        }

        #magazaEkrani h2 {
            color: #00ff88;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .magaza-item {
            background: rgba(0, 210, 255, 0.1);
            border: 2px solid #00d2ff;
            padding: 8px 15px;
            margin: 6px;
            width: 320px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 8px;
        }

        .magaza-item span {
            font-size: 13px;
            font-weight: bold;
        }

        #alt-panel {
            margin-top: 10px;
            display: flex;
            gap: 15px;
        }

        .btn {
            background: linear-gradient(135deg, #00d2ff, #0076ff);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.4);
            transition: all 0.2s ease;
        }

        .btn:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #33dcff, #3393ff);
        }

        .satin-al-btn {
            background: linear-gradient(135deg, #00ff88, #00b359);
            color: #020208;
            border: none;
            padding: 6px 14px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }

        .satin-al-btn:hover {
            background: linear-gradient(135deg, #33ff99, #00cc66);
            transform: scale(1.05);
        }

        .kontroller {
            margin-top: 8px;
            font-size: 13px;
            color: #8888aa;
        }
    </style>
</head>
<body>

    <h1>🛸 GALAKTİK SAVAŞÇI</h1>
    <div id="ust-panel">
        <div>Skor: <span id="skor" style="color: #00ff88;">0</span></div>
        <div>Can: <span id="can" style="color: #ff4757;">3</span></div>
        <div>Lazer: <span id="lazerSeviye" style="color: #ff00ff;">1</span></div>
        <div>Hız: <span id="hizSeviye" style="color: #00d2ff;">1</span></div>
    </div>

    <div id="oyunKapsayici">
        <canvas id="oyunAlani" width="600" height="500"></canvas>

        <div id="magazaEkrani">
            <h2>🛒 GALAKTİK MAĞAZA</h2>
            <div style="color: #00ff88; margin-bottom: 10px; font-size: 15px;">Puanın: <span id="magazaPuan">0</span></div>

            <div class="magaza-item">
                <span>❤️ Can Yenile (+1 Can)<br><small>Fiyat: 50 Puan</small></span>
                <button class="satin-al-btn" onclick="canSatinAl()">Al</button>
            </div>

            <div class="magaza-item">
                <span>⚡ Çiftli Lazer (Seviye Atla)<br><small>Fiyat: 100 Puan</small></span>
                <button class="satin-al-btn" onclick="lazerSatinAl()">Al</button>
            </div>

            <div class="magaza-item">
                <span>🚀 Mekik Hızı Artır<br><small>Fiyat: 75 Puan</small></span>
                <button class="satin-al-btn" onclick="hizSatinAl()">Al</button>
            </div>

            <button class="btn" style="margin-top: 12px; background: #ff4757;" onclick="magazaKapat()">OYUNA DÖN</button>
        </div>
    </div>

    <div id="alt-panel">
        <button class="btn" onclick="magazaAc()">🛒 MAĞAZA (P)</button>
    </div>

    <div class="kontroller">
        🎮 <b>A / D / Yön Tuşları</b>: Hareket | <b>BOŞLUK</b>: Ateş Et | <b>P</b>: Mağaza
    </div>

    <script>
        const canvas = document.getElementById("oyunAlani");
        const ctx = canvas.getContext("2d");

        const skorEl = document.getElementById("skor");
        const canEl = document.getElementById("can");
        const lazerSeviyeEl = document.getElementById("lazerSeviye");
        const hizSeviyeEl = document.getElementById("hizSeviye");
        const magazaEkrani = document.getElementById("magazaEkrani");
        const magazaPuanEl = document.getElementById("magazaPuan");

        let skor = 0;
        let can = 3;
        let lazerSeviye = 1;
        let hizSeviye = 1;
        let oyunAktif = true;
        let magazaAcik = false;

        const tuslar = {};
        window.addEventListener("keydown", (e) => {
            if (e.code === "KeyP") {
                if (magazaAcik) magazaKapat();
                else magazaAc();
            }
            tuslar[e.code] = true;
        });
        window.addEventListener("keyup", (e) => tuslar[e.code] = false);

        // Yıldızlar Arka Planı
        const yildizlar = [];
        for (let i = 0; i < 70; i++) {
            yildizlar.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                boyut: Math.random() * 2,
                hiz: Math.random() * 1.5 + 0.5
            });
        }

        // Oyuncu Mekiği
        const mekiik = {
            x: canvas.width / 2 - 20,
            y: canvas.height - 60,
            genislik: 40,
            yukseklik: 40,
            hiz: 6
        };

        const mermiler = [];
        const dusmanlar = [];
        let sonAtesZamani = 0;

        // Düşman Üretici
        function dusmanOlustur() {
            if (!oyunAktif || magazaAcik) return;
            const tipSecimi = Math.random();
            let genislik = 35;
            let yukseklik = 35;
            let hiz = 2;
            let canDusman = 1;
            let renk = "#ff4757";

            if (tipSecimi > 0.75) {
                genislik = 50;
                yukseklik = 50;
                hiz = 1.2;
                canDusman = 3;
                renk = "#ff9f1a";
            }

            dusmanlar.push({
                x: Math.random() * (canvas.width - genislik),
                y: -yukseklik,
                genislik: genislik,
                yukseklik: yukseklik,
                hiz: hiz,
                can: canDusman,
                maxCan: canDusman,
                renk: renk
            });
        }
        setInterval(dusmanOlustur, 900);

        // Mağaza Kontrolleri
        function magazaAc() {
            if (!oyunAktif) return;
            magazaAcik = true;
            magazaPuanEl.innerText = skor;
            magazaEkrani.style.display = "flex";
        }

        function magazaKapat() {
            magazaAcik = false;
            magazaEkrani.style.display = "none";
        }

        function canSatinAl() {
            if (skor >= 50) {
                skor -= 50;
                can++;
                skorEl.innerText = skor;
                canEl.innerText = can;
                magazaPuanEl.innerText = skor;
            } else {
                alert("❌ Yeterli puanın yok!");
            }
        }

        function lazerSatinAl() {
            if (skor >= 100) {
                skor -= 100;
                lazerSeviye++;
                skorEl.innerText = skor;
                lazerSeviyeEl.innerText = lazerSeviye;
                magazaPuanEl.innerText = skor;
            } else {
                alert("❌ Yeterli puanın yok!");
            }
        }

        function hizSatinAl() {
            if (skor >= 75) {
                skor -= 75;
                hizSeviye++;
                mekiik.hiz += 1.5;
                skorEl.innerText = skor;
                hizSeviyeEl.innerText = hizSeviye;
                magazaPuanEl.innerText = skor;
            } else {
                alert("❌ Yeterli puanın yok!");
            }
        }

        // Oyun Döngüsü
        function oyunDongusu() {
            if (!oyunAktif) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Yıldızları Çiz
            ctx.fillStyle = "#ffffff";
            for (let yildiz of yildizlar) {
                ctx.fillRect(yildiz.x, yildiz.y, yildiz.boyut, yildiz.boyut);
                if (!magazaAcik) {
                    yildiz.y += yildiz.hiz;
                    if (yildiz.y > canvas.height) yildiz.y = 0;
                }
            }

            if (!magazaAcik) {
                // Hareket Kontrolleri
                if ((tuslar["ArrowLeft"] || tuslar["KeyA"]) && mekiik.x > 0) {
                    mekiik.x -= mekiik.hiz;
                }
                if ((tuslar["ArrowRight"] || tuslar["KeyD"]) && mekiik.x < canvas.width - mekiik.genislik) {
                    mekiik.x += mekiik.hiz;
                }

                // Ateş Etme
                if (tuslar["Space"] && Date.now() - sonAtesZamani > 180) {
                    if (lazerSeviye === 1) {
                        mermiler.push({ x: mekiik.x + mekiik.genislik / 2 - 3, y: mekiik.y, genislik: 6, yukseklik: 15, hiz: 9 });
                    } else if (lazerSeviye === 2) {
                        mermiler.push({ x: mekiik.x + 5, y: mekiik.y, genislik: 5, yukseklik: 15, hiz: 9 });
                        mermiler.push({ x: mekiik.x + mekiik.genislik - 10, y: mekiik.y, genislik: 5, yukseklik: 15, hiz: 9 });
                    } else {
                        mermiler.push({ x: mekiik.x + mekiik.genislik / 2 - 3, y: mekiik.y, genislik: 6, yukseklik: 15, hiz: 10 });
                        mermiler.push({ x: mekiik.x + 2, y: mekiik.y, genislik: 5, yukseklik: 15, hiz: 10 });
                        mermiler.push({ x: mekiik.x + mekiik.genislik - 7, y: mekiik.y, genislik: 5, yukseklik: 15, hiz: 10 });
                    }
                    sonAtesZamani = Date.now();
                }

                // Mermiler
                for (let i = mermiler.length - 1; i >= 0; i--) {
                    let m = mermiler[i];
                    m.y -= m.hiz;
                    ctx.fillStyle = "#00ffff";
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = "#00ffff";
                    ctx.fillRect(m.x, m.y, m.genislik, m.yukseklik);
                    ctx.shadowBlur = 0;

                    if (m.y < 0) mermiler.splice(i, 1);
                }

                // Düşmanlar
                for (let i = dusmanlar.length - 1; i >= 0; i--) {
                    let d = dusmanlar[i];
                    d.y += d.hiz;

                    ctx.fillStyle = d.renk;
                    ctx.fillRect(d.x, d.y, d.genislik, d.yukseklik);

                    if (d.maxCan > 1) {
                        ctx.fillStyle = "#555";
                        ctx.fillRect(d.x, d.y - 8, d.genislik, 4);
                        ctx.fillStyle = "#00ff88";
                        ctx.fillRect(d.x, d.y - 8, (d.genislik * (d.can / d.maxCan)), 4);
                    }

                    // Mermi - Düşman Çarpışması
                    for (let j = mermiler.length - 1; j >= 0; j--) {
                        let m = mermiler[j];
                        if (
                            m.x < d.x + d.genislik &&
                            m.x + m.genislik > d.x &&
                            m.y < d.y + d.yukseklik &&
                            m.y + m.yukseklik > d.y
                        ) {
                            mermiler.splice(j, 1);
                            d.can--;
                            if (d.can <= 0) {
                                dusmanlar.splice(i, 1);
                                skor += (d.maxCan * 15);
                                skorEl.innerText = skor;
                            }
                            break;
                        }
                    }

                    // Mekik - Düşman Çarpışması veya Kaçırma
                    if (d) {
                        if (
                            mekiik.x < d.x + d.genislik &&
                            mekiik.x + mekiik.genislik > d.x &&
                            mekiik.y < d.y + d.yukseklik &&
                            mekiik.y + mekiik.yukseklik > d.y
                        ) {
                            dusmanlar.splice(i, 1);
                            can--;
                            canEl.innerText = can;
                        } else if (d.y > canvas.height) {
                            dusmanlar.splice(i, 1);
                            can--;
                            canEl.innerText = can;
                        }
                    }

                    if (can <= 0) {
                        oyunAktif = false;
                        alert("Oyun Bitti! Toplam Skorun: " + skor);
                        location.reload();
                    }
                }
            }

            // Mekiği Çiz
            ctx.fillStyle = "#00d2ff";
            ctx.beginPath();
            ctx.moveTo(mekiik.x + mekiik.genislik / 2, mekiik.y);
            ctx.lineTo(mekiik.x, mekiik.y + mekiik.yukseklik);
            ctx.lineTo(mekiik.x + mekiik.genislik / 2, mekiik.y + mekiik.yukseklik - 12);
            ctx.lineTo(mekiik.x + mekiik.genislik, mekiik.y + mekiik.yukseklik);
            ctx.closePath();
            ctx.fill();

            requestAnimationFrame(oyunDongusu);
        }

        oyunDongusu();
    </script>
</body>
</html>
